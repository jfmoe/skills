name: Agent guardrails

on:
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: Verify agent guardrails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-agent-guardrails.mjs --base "$BASE_SHA"
